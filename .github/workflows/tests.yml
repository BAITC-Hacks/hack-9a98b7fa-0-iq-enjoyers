name: Offline agent tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-agent.txt
            requirements-dev.txt
      - name: Check tracked files for credentials and private data
        run: python scripts/check_publish.py --tracked
      - name: Install pinned dependencies
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Offline contract and regression tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: python -m pytest tests -q --junitxml=artifacts/ci-py${{ matrix.python }}.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python }}
          path: artifacts/ci-py${{ matrix.python }}.xml
          if-no-files-found: ignore
          retention-days: 7
